name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: The v-prefixed tag to build, e.g. v4.0.0
        required: true
        type: string
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  validate:
    name: Validate tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Stop before anything is built or released when the tag disagrees with
      # Cargo.toml or has no dated CHANGELOG.md section. release-plz creates
      # both together, so this only fires on a hand-made tag.
      - name: Check the tag against the declared version
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: sh scripts/check-version.sh "$TAG"

  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
            command: cargo
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-latest
            command: cross
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: stable
      - name: Install musl-tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Install cross
        if: matrix.command == 'cross'
        uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cross
      - name: Add Rust target
        if: matrix.command == 'cargo'
        run: rustup target add "${{ matrix.target }}"
      - name: Build
        run: ${{ matrix.command }} build --release --locked --target "${{ matrix.target }}"
      - name: Package
        id: package
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          tag="$TAG"
          version="${tag#v}"
          staging="stau-${version}-${{ matrix.target }}"
          archive="${staging}.tar.gz"
          mkdir -p "$staging"
          cp "target/${{ matrix.target }}/release/stau" "$staging/"
          # LICENSE-MIT and LICENSE-APACHE must exist at the repository root.
          cp LICENSE-MIT LICENSE-APACHE README.md "$staging/"
          tar -czf "$archive" -C "$staging" stau LICENSE-MIT LICENSE-APACHE README.md
          echo "archive=${archive}" >> "$GITHUB_OUTPUT"
      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.package.outputs.archive }}
          path: ${{ steps.package.outputs.archive }}

  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
          merge-multiple: true
      - name: Generate SHA256SUMS
        working-directory: artifacts
        run: sha256sum -- *.tar.gz > SHA256SUMS
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          tag="$TAG"
          version="${tag#v}"
          # release-plz created the release already, so upload into it. A
          # hand-made tag has no release: create one then, reusing the
          # CHANGELOG section for the version as its notes.
          if ! gh release view "$tag" >/dev/null 2>&1; then
            awk -v ver="$version" '
              /^## / {
                if (found) exit
                if (index($0, "## [" ver "]") == 1) { found = 1; next }
              }
              found && /^\[[^]]+\]:/ { exit }
              found {
                if (!emitted && $0 ~ /^[[:space:]]*$/) next
                emitted = 1
                print
              }
            ' CHANGELOG.md > release-notes.md
            if grep -q '[^[:space:]]' release-notes.md; then
              gh release create "$tag" \
                --verify-tag \
                --notes-file release-notes.md \
                artifacts/*.tar.gz artifacts/SHA256SUMS
            else
              echo "::warning::no CHANGELOG section for $tag; using generated notes"
              gh release create "$tag" \
                --verify-tag \
                --generate-notes \
                artifacts/*.tar.gz artifacts/SHA256SUMS
            fi
          else
            gh release upload "$tag" --clobber artifacts/*.tar.gz artifacts/SHA256SUMS
          fi
