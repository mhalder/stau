[package]
name = "stau"
version = "3.1.1"
edition = "2024"
license = "MIT"
authors = ["mhalder"]
publish = false
repository = "https://github.com/mhalder/stau"
description = "A modern dotfile manager with GNU Stow-style symlink management and automated setup scripts"
readme = "README.md"
keywords = ["dotfiles", "symlink", "stow", "configuration", "cli"]
categories = ["command-line-utilities", "config"]

[dependencies]
clap = { version = "4.6.7", features = ["derive", "env"] }
clap_complete = "4.6.11"
thiserror = "2.0.21"
dirs = "7.0.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
minijinja = "2"
toml = "1"

[dev-dependencies]
tempfile = "3.27.0"
temp-env = "0.3.6"
