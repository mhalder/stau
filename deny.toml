# A new licence appearing is something to look at, not to wave through. The
# list is exactly the licences the dependency tree resolves to: adding an
# unused one makes `cargo deny check` warn, so it stays as short as it can be.
[licenses]
allow = ["MIT", "Apache-2.0", "Unicode-3.0", "MPL-2.0"]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"

[advisories]
yanked = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
